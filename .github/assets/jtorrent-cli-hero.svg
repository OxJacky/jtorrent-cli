<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">JTorrent CLI</title>
  <desc id="desc">Dark purple and cyan JTorrent CLI banner with an illustrated terminal download.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b20"/>
      <stop offset="0.55" stop-color="#101036"/>
      <stop offset="1" stop-color="#081a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a66bff"/>
      <stop offset="1" stop-color="#4ce6f6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7d43f0" stop-opacity=".30"/>
      <stop offset="1" stop-color="#7d43f0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#aab5ff" stroke-opacity=".065"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="440" rx="24" fill="url(#background)"/>
  <rect width="1200" height="440" rx="24" fill="url(#grid)"/>
  <circle cx="390" cy="70" r="280" fill="url(#glow)"/>
  <circle cx="1110" cy="365" r="330" fill="url(#glow)"/>
  <path d="M0 386C195 340 320 445 510 393S856 319 1200 388" fill="none" stroke="#55d9ff" stroke-opacity=".12" stroke-width="2"/>
  <path d="M0 410C195 364 320 469 510 417S856 343 1200 412" fill="none" stroke="#8b60ff" stroke-opacity=".12" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="64" y="62" width="52" height="52" rx="14" fill="#a061ff" fill-opacity=".15" stroke="#a975ff" stroke-opacity=".75"/>
    <path d="M78 83l9 7-9 7M92 97h13" fill="none" stroke="#c5acff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="130" y="96" fill="#d8cbff" font-size="19" font-weight="700" letter-spacing="4">JTORRENT / CLI</text>

    <text x="64" y="190" fill="#ffffff" font-size="54" font-weight="800" letter-spacing="-1.6">Your downloads.</text>
    <text x="64" y="250" fill="url(#accent)" font-size="54" font-weight="800" letter-spacing="-1.6">One command away.</text>
    <text x="66" y="300" fill="#adb5d5" font-size="21">The JTorrent experience, built for your terminal.</text>

    <rect x="64" y="339" width="147" height="42" rx="21" fill="#8c55f0" fill-opacity=".2" stroke="#a879ff" stroke-opacity=".6"/>
    <text x="87" y="366" fill="#ded0ff" font-size="14" font-weight="700" letter-spacing="1">MACOS + LINUX</text>
    <rect x="222" y="339" width="165" height="42" rx="21" fill="#1aafc5" fill-opacity=".13" stroke="#60dce8" stroke-opacity=".55"/>
    <text x="247" y="366" fill="#b5f6f5" font-size="14" font-weight="700" letter-spacing="1">BREW INSTALL</text>
  </g>

  <rect x="643" y="68" width="502" height="324" rx="19" fill="#4d30ab" opacity=".35" filter="url(#shadow)"/>
  <rect x="627" y="52" width="502" height="324" rx="19" fill="#0b1026" stroke="#6d68b6" stroke-opacity=".7" stroke-width="2"/>
  <path d="M628 105h500" stroke="#454b76" stroke-opacity=".6"/>
  <circle cx="657" cy="79" r="6" fill="#fb6b83"/>
  <circle cx="680" cy="79" r="6" fill="#ffc267"/>
  <circle cx="703" cy="79" r="6" fill="#65dfbb"/>
  <text x="875" y="84" fill="#828cab" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1">jtorrent — terminal</text>

  <g font-family="'DejaVu Sans Mono', monospace" font-size="18">
    <text x="658" y="155" fill="#6ee8e7">❯</text>
    <text x="688" y="155" fill="#e9e9fb">jtorrent download</text>
    <text x="658" y="191" fill="#9a91b9">'magnet:?xt=urn:btih:…'</text>
    <text x="658" y="230" fill="#c4acd9">JTorrent cloud</text>
    <text x="658" y="299" fill="#80e2cf">✓</text>
    <text x="688" y="299" fill="#e9e9fb">Download complete</text>
    <text x="658" y="337" fill="#8e9ac0" font-size="16">./jtorrent-download-…/your-file</text>
  </g>
  <rect x="658" y="250" width="424" height="8" rx="4" fill="#323657"/>
  <rect x="658" y="250" width="424" height="8" rx="4" fill="url(#accent)"/>
  <rect x=".5" y=".5" width="1199" height="439" rx="23.5" fill="none" stroke="#8277c2" stroke-opacity=".42"/>
</svg>
